[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nookara"
version = "0.9.0"
description = "Python SDK for Nookara: sign-in, profiles, friends, chat, credits and payments, storage, and bots."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Ikelene"}]
dependencies = []

[project.optional-dependencies]
realtime = ["websockets>=14,<18"]
signing = ["cryptography>=42"]
all = ["websockets>=14,<18", "cryptography>=42"]

[project.urls]
Homepage = "https://nookara.cc"
Source = "https://github.com/Nookara-Project/sdk"
Documentation = "https://nookara.cc/guides/python-sdk"

[tool.setuptools]
packages = ["nookara", "velora_api"]

[tool.setuptools.package-data]
nookara = ["catalogue.json", "instance_catalogue.json", "py.typed"]
